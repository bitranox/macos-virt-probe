name: probe

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-26, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Facts
      run: |
        sw_vers
        echo "arch=$(uname -m)"
        echo "hv_support=$(sysctl -n kern.hv_support 2>&1)"
        echo "hv_vmm_present=$(sysctl -n kern.hv_vmm_present 2>&1)"
        sysctl -n machdep.cpu.brand_string 2>&1 || true
        sysctl hw.model 2>&1 || true

    - name: Install QEMU
      run: brew install qemu

    - name: Boot attempts
      shell: bash
      run: |
        # GitHub runs `shell: bash` with -e, and a guest that starts ends at the
        # timeout's 124: without +e the control's success ends the step.
        set +e -u
        if [ "$(uname -m)" = "arm64" ]; then
          qemu=(qemu-system-aarch64 -machine virt -m 256 -display none -serial none -monitor none)
        else
          qemu=(qemu-system-x86_64 -m 256 -display none -serial none -monitor none)
        fi
        attempt() {
          local label=$1; shift
          local start=$SECONDS
          # A guest that starts runs until the timeout kills it (124); a refused
          # accelerator exits at once with its own error.
          gtimeout 20 "${qemu[@]}" "$@" > "$label.log" 2>&1
          local rc=$?
          echo "RESULT $label rc=$rc seconds=$((SECONDS - start))"
          sed -n '1,15p' "$label.log"
        }
        brew list coreutils > /dev/null 2>&1 || brew install coreutils
        attempt tcg-control -accel tcg -cpu max
        attempt hvf -accel hvf -cpu host

    - name: Guest DHCP behind a vmnet bridge
      shell: bash
      run: |
        # A paused x86 guest on vmnet-shared: macOS makes bridge100, adds the guest's
        # vmenet port as a member and serves DHCP itself. The watchers start on the
        # member port, then the guest is resumed and its network ROM asks for an address.
        set +e -u
        python3 -m venv /tmp/v && /tmp/v/bin/pip install -q ipscout==2.5.4
        mac=00:00:5e:00:53:10
        if [ "$(sysctl -n kern.hv_support)" = "1" ]; then accel=hvf; else accel=tcg; fi
        echo "accel=$accel"
        sudo gtimeout 150 qemu-system-x86_64 -accel "$accel" -m 256 -S -display none -serial none \
          -monitor unix:/tmp/qmon.sock,server,nowait \
          -netdev vmnet-shared,id=n0 -device virtio-net-pci,netdev=n0,mac="$mac" -boot n \
          > /tmp/qemu.log 2>&1 &
        member=""
        for _ in $(seq 1 30); do
          member=$(ifconfig bridge100 2>/dev/null | awk '/member:/ {print $2; exit}')
          [ -n "$member" ] && break
          sleep 1
        done
        echo "member=$member"
        ifconfig bridge100
        cat /tmp/qemu.log
        if [ -z "$member" ]; then echo "RESULT no-member"; exit 0; fi
        # -l: a redirected tcpdump buffers its output until it exits.
        sudo gtimeout 70 tcpdump -l -n -e -i "$member" port 67 or port 68 > /tmp/tcpdump.log 2>&1 &
        sniffer=$!
        sudo /tmp/v/bin/ipscout --json observe-dhcp "$mac" --interface "$member" --timeout 60 --settle 5 \
          > /tmp/observe.json 2> /tmp/observe.err &
        observer=$!
        sleep 3
        printf 'cont\n' | sudo nc -U /tmp/qmon.sock > /dev/null
        wait "$observer"
        echo "RESULT observe rc=$?"
        cat /tmp/observe.json /tmp/observe.err
        sudo kill -INT "$sniffer"
        wait "$sniffer"
        echo "--- tcpdump on $member"
        cat /tmp/tcpdump.log
        echo "--- bridge refusal"
        sudo /tmp/v/bin/ipscout --json observe-dhcp "$mac" --interface bridge100 --timeout 5
        echo "RESULT bridge rc=$?"
        printf 'quit\n' | sudo nc -U /tmp/qmon.sock > /dev/null
    - name: ipscout live test
      shell: bash
      run: |
        set +e
        /tmp/v/bin/pip install -q pytest
        for round in 1 2 3; do
          sudo IPSCOUT_HOST_WRITE_TESTS=1 PATH="$PATH" /tmp/v/bin/python -m pytest -v -rs -p no:cacheprovider test_dhcp_macos_vmnet_live.py
          echo "RESULT pytest round=$round rc=$?"
        done
